global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "recommendation-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "postgres"
    static_configs:
      - targets: ["db:9187"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
