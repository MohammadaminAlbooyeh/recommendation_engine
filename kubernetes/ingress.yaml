apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recommendation-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: recommendations.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: recommendation-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recommendation-frontend-service
                port:
                  number: 80
