apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendation-config
  labels:
    app: recommendation-engine
data:
  database_url: "postgresql://postgres:postgres@postgres-service:5432/recommendation_db"
  redis_url: "redis://redis-service:6379/0"
  log_level: "INFO"
  cache_ttl: "300"
  default_recommendations_n: "10"
