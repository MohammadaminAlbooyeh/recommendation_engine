<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook Elite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>Smart Notes</h1>
    </header>

    <main class="container">
        <div class="main-layout">
            <!-- Form Section -->
            <aside>
                <div class="card-glass">
                    <h2 id="form-title">New Jotting</h2>
                    <form id="note-form">
                        <input type="hidden" id="note-id">
                        <div class="form-group">
                            <label for="title">Headline</label>
                            <input type="text" id="title" placeholder="Keep it catchy..." required>
                        </div>
                        <div class="form-group">
                            <label for="content">Details</label>
                            <textarea id="content" rows="8" placeholder="Spill your thoughts..." required></textarea>
                        </div>
                        <button type="submit" id="submit-btn" class="btn-primary">Save Note</button>
                        <button type="button" id="cancel-btn" style="width: 100%; border: none; background: transparent; padding: 0.75rem; color: #64748b; cursor: pointer; display: none;">Discard Changes</button>
                    </form>
                </div>
            </aside>

            <!-- Notes Section -->
            <section>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 style="margin: 0; font-size: 1.25rem; font-weight: 600;">Your Collection</h2>
                    <span id="note-count" style="font-size: 0.875rem; color: var(--text-gray); background: white; padding: 0.25rem 0.75rem; border-radius: 1rem; border: 1px solid #e2e8f0;">0 notes</span>
                </div>
                <div id="notes">
                    <!-- Loading state or notes -->
                </div>
            </section>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
